name: Blockifier-Publish

# Publishes blockifier and the workspace crates it depends on to crates.io, then tags
# blockifier-v<version>. Run it on a release branch whose workspace version is <version>; main
# carries the placeholder version 0.0.0 and is never published.
#
# Authorization: the crates.io token lives only in the `crates-io-publish` environment, which
# requires approval from an authorized reviewer and only accepts release branches. Anyone who can
# dispatch this workflow (including the Starky Slack bot) can start a run, but nothing is uploaded
# until a reviewer approves the `publish` job. The token itself is scoped to publish-update on the
# blockifier crate family, so it cannot create or publish any other crate.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must equal the workspace version on the branch (e.g. 0.20.0-rc.2)."
        required: true
        type: string

# Never run two releases at once, and never cancel one midway.
concurrency:
  group: blockifier-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: namespace-profile-medium-ubuntu-24-04-amd64
    timeout-minutes: 90
    steps:
      - name: Refuse refs that are not release branches
        if: github.ref_type != 'branch' || github.ref_name == 'main'
        run: |
          echo "::error::Run this workflow on a release branch, not on '${GITHUB_REF_NAME}'."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/bootstrap
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dry run
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/publish_blockifier.py publish --version "${VERSION}" --dry-run

  publish:
    needs: verify
    runs-on: namespace-profile-medium-ubuntu-24-04-amd64
    timeout-minutes: 120
    environment: crates-io-publish
    permissions:
      # To push the blockifier-v<version> tag.
      contents: write
    steps:
      # Check out the exact commit that passed the dry run, even if the branch moved while the run
      # was waiting for approval.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/bootstrap
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        env:
          VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 scripts/publish_blockifier.py publish --version "${VERSION}"
