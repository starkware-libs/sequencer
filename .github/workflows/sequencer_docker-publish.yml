name: Sequencer-Docker-Publish

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Cargo build profile: release, debug, or profiling (release with debug symbols + heaptrack)."
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
          - profiling
  push:
    tags:
      - "v*.*.*"
      - "APOLLO-*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}
  RUSTFLAGS: "-D warnings"

jobs:
  docker-build-push:
    runs-on: namespace-profile-small-ubuntu-24-04-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Login to a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Login to registry ${{ env.REGISTRY }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_NAME }}/sequencer
          tags: |
            # Tag-based releases
            type=raw,enable=${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }},value={{tag}}
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Commit-hash tag: published on every tag push, lets downstream consumers
            # pin to a specific commit without needing to chase the human-readable tag.
            type=sha,prefix=,format=short,enable=${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
            # Manual workflow dispatch
            type=raw,value={{branch}}{{tag}}-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}

      # Build and push Docker image with Buildx
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/images/sequencer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_MODE=${{ inputs.build_mode || 'release' }}
