include:
  - configs/overlays/hybrid/common/services/committer.yaml
  - configs/overlays/hybrid/echonet/common.yaml

# A hand-made disk seeded with the committer storage before the first start (see README.md).
persistentVolume:
  enabled: true
  accessModes:
    - ReadWriteOnce
  mountPath: "/data"
  size: "300Gi"
  storageClass: "hyperdisk-balanced"
  existingClaim: "sequencer-committer-data"

# Same zone as sequencer-node-data, so the seeding pod can mount both disks.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - us-central1-f

# The 8GiB inner storage cache plus the 10M-entry cache outgrow 16GiB on mainnet replay.
resources:
  requests:
    cpu: "1"
    memory: "16Gi"
  limits:
    cpu: "3"
    memory: "32Gi"
