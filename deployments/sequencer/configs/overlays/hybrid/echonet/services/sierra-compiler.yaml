include:
  - configs/overlays/hybrid/common/services/sierra-compiler.yaml
  - configs/overlays/hybrid/echonet/common.yaml

# Compilation runs in a child process capped at max_memory_usage (20GiB), which counts toward
# this limit.
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "24Gi"
