[build]
rustc-wrapper = "sccache"

[env]
LLVM_SYS_191_PREFIX = "/usr/lib/llvm-19/"
MLIR_SYS_190_PREFIX = "/usr/lib/llvm-19/"
# Tests seed their RNG from SEED; 0 matches CI. Override with `SEED=<n> cargo test`, or use
# `SEED=$RANDOM cargo test` for a random seed.
SEED = "0"
TABLEGEN_190_PREFIX = "/usr/lib/llvm-19/"
